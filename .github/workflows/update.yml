name: Update FC27 Radar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: fc27-radar-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update content radar
        run: python scripts/update.py
      - name: Update PC market radar from FUT.GG
        env:
          FC27_PLATFORM: pc
          FUTGG_PAGES_PER_RUN: "20"
        run: python scripts/engine.py
      - name: Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify.py
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "fc27-market-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update FC27 PC radar data [skip ci]"
          git push
