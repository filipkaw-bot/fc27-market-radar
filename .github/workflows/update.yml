name: Update FC27 Radar
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send Telegram test message"
        required: false
        default: "false"
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
concurrency:
  group: fc27-radar-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update content radar
        run: python scripts/update.py
      - name: Update market radar
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
        run: python scripts/engine.py
      - name: Telegram test
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.telegram_test == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify.py --test
      - name: Telegram alerts
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.telegram_test == 'true') }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/notify.py
      - name: Commit data
        run: |
          git config user.name "fc27-market-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update FC27 radar data"
          git push
